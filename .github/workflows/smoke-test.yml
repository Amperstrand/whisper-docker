name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests (production)
        run: bash smoke-test.sh production

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e transcription test
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: bash e2e-test.sh production
