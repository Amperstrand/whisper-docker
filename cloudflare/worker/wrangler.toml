name = "whisper-transcribe"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGIN = "*"

# Import static assets as text modules
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js"]
fallthrough = true

# R2 bucket binding (name must match R2 bucket name)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "whisper-transcriptions"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "whisper-transcriptions"
database_id = "PLACEHOLDER"
